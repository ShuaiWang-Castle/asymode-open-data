name: compile-claude-reviewed-aistats

on:
  push:
    branches:
      - gpt-claude-review-main-experiment-20260903
    paths:
      - "paper/aistats/main_reviewed.tex"
      - "paper/aistats/references.bib"
      - "paper/aistats/build.sh"
      - ".github/workflows/compile-claude-reviewed-aistats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra latexmk \
            poppler-utils curl unzip
      - name: Compile reviewed manuscript
        working-directory: paper/aistats
        run: |
          cp main_reviewed.tex main.tex
          ./build.sh
      - name: Check manuscript
        working-directory: paper/aistats
        run: |
          ! grep -Eqi "undefined references|Citation .* undefined|There were undefined" main.log
          pdfinfo main.pdf | tee reviewed_pdfinfo.txt
          pdffonts main.pdf | tee reviewed_pdffonts.txt
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: claude-reviewed-aistats-manuscript
          path: |
            paper/aistats/main.pdf
            paper/aistats/main.log
            paper/aistats/reviewed_pdfinfo.txt
            paper/aistats/reviewed_pdffonts.txt
          if-no-files-found: error
