name: cleanup-stale-branches

on:
  push:
    branches:
      - aistats-current
    paths:
      - .github/workflows/cleanup-stale-branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete working branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          readonly keep_main="main"
          readonly keep_work="aistats-current"

          mapfile -t branches < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          echo "Branches before cleanup:"
          printf '  %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "$keep_main" || "$branch" == "$keep_work" ]]; then
              echo "KEEP   $branch"
              continue
            fi
            echo "DELETE $branch"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

          mapfile -t remaining < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          echo "Branches after cleanup:"
          printf '  %s\n' "${remaining[@]}"

          for branch in "${remaining[@]}"; do
            if [[ "$branch" != "$keep_main" && "$branch" != "$keep_work" ]]; then
              echo "Unexpected branch remains: $branch" >&2
              exit 1
            fi
          done

          [[ " ${remaining[*]} " == *" $keep_main "* ]]
          [[ " ${remaining[*]} " == *" $keep_work "* ]]
