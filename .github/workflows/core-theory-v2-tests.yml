name: core-theory-v2-tests

on:
  push:
    branches:
      - gpt-unified-aistats-v2-20260903
    paths:
      - "tests/test_core_theory_v2.py"
      - "docs/CORE_THEORY_V2.md"
      - ".github/workflows/core-theory-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run theory tests
        run: pytest -q tests/test_core_theory_v2.py
