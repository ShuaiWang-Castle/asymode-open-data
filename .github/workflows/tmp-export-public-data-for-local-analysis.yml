name: tmp-export-public-data-for-local-analysis

on:
  push:
    branches:
      - open-audit-20260904
    paths:
      - .github/workflows/tmp-export-public-data-for-local-analysis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f3ff3aa616fac7540eae45415089127816f3199
          fetch-depth: 1
      - name: Verify pinned public data
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c data/SHA256SUMS.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('configs/panel_manifest_g3-all-26.json').read_text())
          assert m['digest']=='db286b4960a4'
          assert len(m['panels'])==26 and len(set(m['panels']))==26
          print('manifest', m['digest'], len(m['panels']))
          print('sha256sums', hashlib.sha256(Path('data/SHA256SUMS.txt').read_bytes()).hexdigest())
          PY
      - name: Stage exact analysis-ready inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/data/interim export/configs export/analysis/gpt_rescue_20260904/cc_v2
          cp data/README.md data/SHA256SUMS.txt export/data/
          cp data/interim/panel_*.npz export/data/interim/
          cp data/interim/drivers_*.npz export/data/interim/
          cp data/interim/county_statics.parquet export/data/interim/
          cp data/interim/storm_events_county.parquet export/data/interim/
          cp data/interim/event_days_stratified.parquet export/data/interim/
          cp configs/panel_manifest_g3-all-26.json export/configs/
          cp analysis/gpt_rescue_20260904/cc_v2/event_folds_v2.json export/analysis/gpt_rescue_20260904/cc_v2/
          printf '%s\n' 'data_commit=8dd47c5ccd829611f27b69a3d64c274a0a24c400' > export/EXPORT_PROVENANCE.txt
          printf '%s\n' 'source_result_commit=5f3ff3aa616fac7540eae45415089127816f3199' >> export/EXPORT_PROVENANCE.txt
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/EXPORTED_SHA256SUMS.txt
          du -sh export
      - name: Upload exact public-data bundle
        uses: actions/upload-artifact@v4
        with:
          name: asymode-public-data-pinned-8dd47c5
          path: export/
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
