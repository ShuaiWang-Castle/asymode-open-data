name: post-pilot-root-cause-audit

on:
  push:
    branches:
      - open-audit-20260904
    paths:
      - "analysis/post_pilot_root_cause_20260904/root_cause_audit.py"
      - ".github/workflows/post-pilot-root-cause-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas tabulate
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run committed-code and committed-result audit
        env:
          PYTHONPATH: src:experiments
        run: |
          python analysis/post_pilot_root_cause_20260904/root_cause_audit.py
      - name: Upload generated audit
        uses: actions/upload-artifact@v4
        with:
          name: post-pilot-root-cause-audit
          path: |
            analysis/post_pilot_root_cause_20260904/ROOT_CAUSE_AUDIT_GENERATED.md
            analysis/post_pilot_root_cause_20260904/ROOT_CAUSE_AUDIT.json
          if-no-files-found: error
