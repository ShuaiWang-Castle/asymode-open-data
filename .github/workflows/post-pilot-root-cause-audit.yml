name: post-pilot-root-cause-audit

on:
  push:
    branches:
      - open-audit-20260904
    paths:
      - "analysis/post_pilot_root_cause_20260904/root_cause_audit.py"
      - "analysis/post_pilot_root_cause_20260904/transition_data_audit.py"
      - ".github/workflows/post-pilot-root-cause-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow tabulate
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Add the frozen fold id to the ephemeral event table
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('analysis/gpt_rescue_20260904/cc_v2')
          p = root / 'event_design_table.csv'
          d = pd.read_csv(p)
          f = json.loads((root / 'event_folds_v2.json').read_text())
          fold_of = {e: int(k) for k, events in f['folds'].items() for e in events}
          d['fold'] = d['event'].map(fold_of)
          d.to_csv(p, index=False)
          PY
      - name: Run committed-code and committed-result audit
        env:
          PYTHONPATH: src:experiments
        run: |
          python analysis/post_pilot_root_cause_20260904/root_cause_audit.py
      - name: Run transition, mask, origin and weighting audit when panel bytes are mounted
        env:
          PYTHONPATH: src:experiments
        run: |
          if ls data/interim/panel_*.npz >/dev/null 2>&1; then
            python analysis/post_pilot_root_cause_20260904/transition_data_audit.py
          else
            cat > analysis/post_pilot_root_cause_20260904/TRANSITION_DATA_AUDIT_GENERATED.md <<'EOF'
          # Transition/data-path audit blocked

          The branch checkout used by GitHub Actions does not contain the raw/interim `panel_*.npz` bytes. The source-level mask defect is established by `experiments/paper_v2_pilot.py`, but its contaminated-row share cannot be recomputed from committed bytes in this workflow. Run `transition_data_audit.py` in the same mounted environment that produced the pilot before the next fit.
          EOF
            printf '{"status":"BLOCKED","reason":"panel_*.npz absent from branch checkout"}\n' > analysis/post_pilot_root_cause_20260904/TRANSITION_DATA_AUDIT.json
            printf 'status,reason\nBLOCKED,panel bytes absent\n' > analysis/post_pilot_root_cause_20260904/TRANSITION_EVENT_AUDIT.csv
          fi
      - name: Upload generated audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-pilot-root-cause-audit
          path: |
            analysis/post_pilot_root_cause_20260904/ROOT_CAUSE_AUDIT_GENERATED.md
            analysis/post_pilot_root_cause_20260904/ROOT_CAUSE_AUDIT.json
            analysis/post_pilot_root_cause_20260904/TRANSITION_DATA_AUDIT_GENERATED.md
            analysis/post_pilot_root_cause_20260904/TRANSITION_DATA_AUDIT.json
            analysis/post_pilot_root_cause_20260904/TRANSITION_EVENT_AUDIT.csv
          if-no-files-found: error
