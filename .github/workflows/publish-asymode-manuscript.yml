name: Publish current AsymODE manuscript
on:
  push:
    branches: [manuscript/asymode-current-20260918]
    paths: [.github/workflows/publish-asymode-manuscript.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify the current manuscript files
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0a60-81f5-8d6b-4973b2e1cc0b/raw?se=2026-09-19T01%3A49%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=d4987ac2-fc21-560b-aebb-f131362baf8e&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A17%3A46Z&ske=2026-09-19T20%3A17%3A46Z&sks=b&skv=2026-02-06&sig=ELZ9j4g7bZ3v77Bbu67S1UGLfJ/P7a6zfhxA0fMc2d0%3D'
          ARCHIVE_SHA256: '33c6f4c54e4e0e720a1f979eadbe7bb6457ee4c467eb24029f165a16e68dbbe2'
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, re, urllib.request, zipfile
          url = os.environ['SOURCE_URL']
          print('::add-mask::' + url)
          request = urllib.request.Request(url, headers={'User-Agent': 'AsymODE-manuscript-publication/1.0'})
          payload = urllib.request.urlopen(request, timeout=90).read()
          assert hashlib.sha256(payload).hexdigest() == os.environ['ARCHIVE_SHA256'], 'Archive checksum mismatch'
          expected = {
              'AsymODE.tex', 'AsymODE.pdf', 'AsymODE_Figures.pdf', 'README.md', 'SHA256SUMS.txt',
              'figures/fig_response_distributions.pdf', 'figures/fig_two_models_shared_info.pdf',
              'figures/fig_synthetic_decomposition.pdf', 'figures/fig_synthetic_risk_map.pdf',
              'figures/fig_synthetic_advantage_map.pdf', 'figures/fig_real_outage_level.pdf',
              'figures/fig_real_benchmark_alignment.pdf', 'figures/fig_real_lambda_violin.pdf',
              'figures/fig_real_feature_guided_selection.pdf', 'figures/fig_synthetic_calibration.pdf',
              'figures/fig_real_event_heterogeneity.pdf'
          }
          target = pathlib.Path('manuscript')
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              assert set(archive.namelist()) == expected, 'Unexpected archive contents'
              for name in sorted(expected):
                  dest = target / name
                  assert not dest.exists(), 'Refusing to overwrite existing path: ' + str(dest)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  data = archive.read(name)
                  if name.endswith('.pdf'):
                      assert data.startswith(b'%PDF-'), 'Invalid PDF: ' + name
                  dest.write_bytes(data)
          for line in (target / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest, name
          tex = (target / 'AsymODE.tex').read_text()
          for name in re.findall(r'\\AsymFigure\{([^}]+)\}', tex):
              assert (target / 'figures' / (name + '.pdf')).is_file(), name
          assert 'AsymODE_A.pdf' not in tex and 'AsymODE_Figures_A.pdf' not in tex
          print('Verified 16 files: current TeX, manuscript PDF, combined figure PDF, 11 figure PDFs, README and checksums.')
          PY
      - name: Commit only manuscript files and remove one-time importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manuscript
          git rm -- .github/workflows/publish-asymode-manuscript.yml
          git commit -m 'Publish AsymODE manuscript and all figure PDFs without A/B suffixes'
          git push origin HEAD:refs/heads/manuscript/asymode-current-20260918
