name: gpt-rescue-static-audit

on:
  push:
    branches:
      - open-audit-20260904
    paths:
      - "analysis/gpt_rescue_20260904/05_MODEL_V3_REFERENCE.py"
      - "analysis/gpt_rescue_20260904/06_STATIC_RESULT_AUDIT.py"
      - ".github/workflows/gpt-rescue-static-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run static result audit
        run: |
          python analysis/gpt_rescue_20260904/06_STATIC_RESULT_AUDIT.py
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run nested-model reference self-test
        run: |
          python -m py_compile analysis/gpt_rescue_20260904/05_MODEL_V3_REFERENCE.py
          python analysis/gpt_rescue_20260904/05_MODEL_V3_REFERENCE.py | tee analysis/gpt_rescue_20260904/MODEL_V3_SELF_TEST.txt
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: gpt-rescue-static-audit
          path: |
            analysis/gpt_rescue_20260904/STATIC_RESULT_AUDIT.md
            analysis/gpt_rescue_20260904/STATIC_RESULT_AUDIT.json
            analysis/gpt_rescue_20260904/MODEL_V3_SELF_TEST.txt
          if-no-files-found: error
